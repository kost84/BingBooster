<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      padding: 15px;
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e2e;
      color: #cdd6f4;
    }
    h3 { margin-top: 0; color: #89b4fa; text-align: center; }
    label { display: block; margin-top: 10px; font-size: 13px; }
    input {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
      box-sizing: border-box;
      border: 1px solid #45475a;
      border-radius: 4px;
      background: #313244;
      color: #fff;
    }
    .buttons { display: flex; gap: 8px; margin-top: 15px; }
    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    #startBtn { background-color: #a6e3a1; color: #11111b; }
    #stopBtn { background-color: #f38ba8; color: #11111b; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      color: #f9e2af;
    }
  </style>
</head>
<body>
  <h3>Bing Booster</h3>

  <label for="count">Nombre de recherches :</label>
  <input type="number" id="count" value="30" min="1" max="100">

  <label for="delay">Délai moyen (secondes) :</label>
  <input type="number" id="delay" value="7" min="3" max="60">

  <div class="buttons">
    <button id="startBtn">Lancer</button>
    <button id="stopBtn">Arrêter</button>
  </div>

  <div id="status">Prêt</div>

  <script src="popup.js"></script>
</body>
</html>
